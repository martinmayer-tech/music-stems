# RAVINTIO Component Manifest
id: "stem-service"
name: "Stem service"
feature: "0000010-http-api"
version: "0.5.0"
status: "active"
type: "microservice"
domain: "stem-separation"
summary: "Holds the job store, the worker, and the HTTP API. All three are built."
systemContext: "Sits between the web page and stem-core. Receives uploads and runs jobs."

responsibilities:
  - "Holds the SQLite job store and the worker that runs jobs through split()."
  - "Holds the HTTP API: upload, job status, and stem download, on 127.0.0.1 by default."

exceptions: []

stack:
  language: "python"
  runtime: "python"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "sqlite"
  orm: "none"
  testing: "pytest"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  inputs:
    - "JobStore.add(input_path, full_stems, options)"
    - "start_workers(store, devices)"
    - "POST /jobs, GET /jobs, GET /jobs/{id}, GET /jobs/{id}/stems/{name}"
    - "create_app(data_dir, run_workers, worker_options, max_upload_bytes)"
  outputs:
    - "A job row that ends as done with output paths, or as failed with one error line"
    - "A JSON job without server paths, and each stem as a WAV file"
  consumedBy: []
  consumes:
    - "stem-core: split(mix_path, out_dir, full_stems, separator_factory)"
  breakingChangePolicy: "requires-adr"

data:
  ownsData: true
  tables:
    - "jobs"
  schemaVersion: "1.0.0"

scope:
  inScope:
    - "The jobs table, the job store, the worker, the model pool, restart recovery, and the HTTP API"
  outOfScope:
    - "A login, cancel, delete, caller model choice, and a broker"
  deferred:
    - "The web page waits for step 6"
    - "Caller model choice and ensembles wait for step 7"

risk:
  level: "low"
  items:
    - "A real Separator may ignore a changed output_dir"
    - "A restart during a job leaves it running until recover() runs"
    - "The service has no login, so a public STEMS_HOST exposes an open upload route"

quality:
  testCoverage:
    unit: 65
    integration: 0
    e2e: 0
  techDebt: []
  quirks:
    - "JobStore opens one connection for each call"
    - "start_workers recovers once and starts each worker with recover=False"
    - "create_app builds the store and the uploads folder at once, and starts the worker at start-up"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "greenfield"
  domainKnowledgePath: "plan/_archive/0000010-http-api-2026-11-16"

