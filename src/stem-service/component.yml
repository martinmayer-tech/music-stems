# RAVINTIO Component Manifest
id: "stem-service"
name: "Stem service"
feature: "0000016-docker-packaging"
version: "0.8.0"
status: "active"
type: "microservice"
domain: "stem-separation"
summary: "Holds the job store, the worker, the HTTP API, the route that serves the web page, and the Docker image and compose files."
systemContext: "Sits between the web page and stem-core. Receives uploads, runs jobs, and serves the page."

responsibilities:
  - "Holds the SQLite job store and the worker that runs jobs through split()."
  - "Holds the HTTP API: upload, job status, and stem download, on 127.0.0.1 by default."
  - "Holds the Dockerfile, the .dockerignore file, compose.yaml, and compose.gpu.yaml at the repo root."

exceptions: []

stack:
  language: "python"
  runtime: "python"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "sqlite"
  orm: "none"
  testing: "pytest"
  iac: "dockerfile"
  cloud: "none"
  compute: "docker"
  ci: "github-actions"

contract:
  inputs:
    - "JobStore.add(input_path, full_stems, options)"
    - "start_workers(store, devices)"
    - "POST /jobs, GET /jobs, GET /jobs/{id}, GET /jobs/{id}/stems/{name}"
    - "GET / and /static/{file}, which serve the page of stem-web"
    - "create_app(data_dir, run_workers, worker_options, max_upload_bytes)"
  outputs:
    - "A job row that ends as done with output paths, or as failed with one error line"
    - "A JSON job without server paths, and each stem as a WAV file"
  consumedBy: []
  consumes:
    - "stem-core: split(mix_path, out_dir, full_stems, separator_factory)"
    - "stem-web: static_dir()"
  breakingChangePolicy: "requires-adr"

data:
  ownsData: true
  tables:
    - "jobs"
  schemaVersion: "1.0.0"

scope:
  inScope:
    - "The jobs table, the job store, the worker, the model pool, restart recovery, the HTTP API, and the page route"
    - "The Dockerfile, the compose files, and the CI image build"
  outOfScope:
    - "A login, cancel, delete, a free model name, a broker, and publishing the image"
  deferred:
    - "none"

risk:
  level: "low"
  items:
    - "A real Separator may ignore a changed output_dir"
    - "A restart during a job leaves it running until recover() runs"
    - "The service has no login, so a public STEMS_HOST exposes an open upload route"
    - "The container binds to all interfaces, so a compose port without 127.0.0.1 exposes the same route"

quality:
  testCoverage:
    unit: 91
    integration: 0
    e2e: 0
  techDebt: []
  quirks:
    - "JobStore opens one connection for each call"
    - "start_workers recovers once and starts each worker with recover=False"
    - "create_app builds the store and the uploads folder at once, and starts the worker at start-up"
    - "create_app imports stem_web for the page folder, so src/stem-web must be on the Python path"
    - "The image sets PYTHONPATH to the three src folders, because the root pyproject installs stem_core only"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "greenfield"
  domainKnowledgePath: "plan/current"

metadata:
  createdAt: "2026-11-15T20:57:56Z"
